[project]
name = "graph-mcp"
version = "0.1.0"
description = "Python MCP server serving a unified code + spec graph for context-efficient agent workflows"
requires-python = ">=3.11"
dependencies = [
    "mcp",
    "tree-sitter",
    "tree-sitter-language-pack",
    "click",
    "fastembed",
    "sqlite-vec",
]

[project.optional-dependencies]
torch = [
    "sentence-transformers",
]
dev = [
    "pytest",
]

[project.scripts]
graph-mcp = "graph_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_mcp"]
